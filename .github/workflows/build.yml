name: build-redfin-fart

on:
  workflow_dispatch:
    inputs:
      aosp_tag:
        description: "AOSP tag to build"
        required: false
        default: "android-12.1.0_r2"

permissions:
  contents: write

jobs:
  sync:
    name: "1/3 - repo sync AOSP"
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      AOSP_TAG: ${{ inputs.aosp_tag || 'android-12.1.0_r2' }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Create swap (8GB)
        run: |
          if ! sudo swapon --show | grep -q '/swapfile'; then
            if [ ! -f /swapfile ]; then
              # fallocate sometimes creates a sparse file whose actual block usage
              # is far less than the requested size; mkswap then reports the
              # smaller size. Use dd with a real block device for a guaranteed
              # 8GB file.
              sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=none
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
            fi
            sudo swapon /swapfile
          fi
          sudo swapon --show
          free -h

      - name: Install repo tool
        run: |
          sudo apt-get update
          sudo apt-get install -y repo git curl python3
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Checkout repo with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize repo manifest
        run: |
          mkdir -p aosp
          cd aosp
          repo init -u https://android.googlesource.com/platform/manifest -b "${AOSP_TAG:-android-12.1.0_r2}" --depth=1 -g all,-notdefault

      - name: Repo sync
        run: |
          cd aosp
          # Add retry+timeout to each git operation. googlesource rate-limits
          # hosted runners; without retries, a single throttled fetch stalls
          # the whole sync indefinitely.
          git config --global http.postBuffer 524288000
          git config --global core.compression 0
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 600
          # -j4 caps parallelism to avoid hammering mirrors. --no-tags + --depth=1
          # already minimize fetches. --use-superproject enables the partial
          # clone manifest from ANDROID 12+ that allows lazy checkout.
          repo sync -c -j4 --no-tags --no-clone-bundle --use-superproject --retry-fetches=3
          echo "aosp synced: $(du -sh .repo | cut -f1) of manifest metadata"

  build:
    name: "2/3 - build boot.img (boot + ART only)"
    needs: sync
    runs-on: ubuntu-22.04
    timeout-minutes: 480
    env:
      AOSP_TAG: ${{ inputs.aosp_tag || 'android-12.1.0_r2' }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Create swap (8GB)
        run: |
          if ! sudo swapon --show | grep -q '/swapfile'; then
            if [ ! -f /swapfile ]; then
              # fallocate sometimes creates a sparse file whose actual block usage
              # is far less than the requested size; mkswap then reports the
              # smaller size. Use dd with a real block device for a guaranteed
              # 8GB file.
              sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=none
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
            fi
            sudo swapon /swapfile
          fi
          sudo swapon --show
          free -h

      - name: Install build deps + repo tool
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip \
            curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            libncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig ccache \
            python3 python-is-python3 repo
          # AOSP's prebuilt clang (clang-3289846/bin/clang.real) is dynamically linked
          # against the SONAME libncurses.so.5. Ubuntu 22.04 ships libncurses6 by
          # default; libncurses5-dev only pulls headers, not the runtime .so.5.
          # Without this the renderscript bitcode compile step fails with:
          #   "error while loading shared libraries: libncurses.so.5"
          sudo apt-get install -y libncurses5 || \
            (cd /tmp && \
             curl -sLO http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.3-2ubuntu0.1_amd64.deb && \
             sudo dpkg -i libncurses5_6.3-2ubuntu0.1_amd64.deb && \
             rm -f libncurses5_6.3-2ubuntu0.1_amd64.deb)
          ldconfig -p | grep ncurses | head -5

      - name: Checkout repo (submodule access)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify fart12-lite submodule present
        run: |
          ls fart12-lite/art/runtime/art_method.cc
          ls fart12-lite/frameworks/base/core/java/cn/zskkk/FFaarrtt.java
          ls fart12-lite/libcore/dalvik/src/main/java/dalvik/system/DexFile.java

      - name: Re-sync AOSP tree (independent from sync job)
        run: |
          mkdir -p aosp
          cd aosp
          repo init -u https://android.googlesource.com/platform/manifest -b "${AOSP_TAG:-android-12.1.0_r2}" --depth=1 -g all,-notdefault
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle

      - name: Restore ccache + soong bootstrap
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            aosp/out/soong/.bootstrap
          # Primary key tied to the SHA: when the same commit builds twice it
          # restores. Restore-keys provide a graceful fallback across commits
          # (the old dc67e88 cache is 220MB of soong bootstrap + ccache that
          # the next run can re-use even after a new commit).
          key: build-redfin-${{ github.sha }}
          restore-keys: |
            build-redfin-

      - name: Copy fart12-lite files into AOSP tree
        run: |
          cd aosp
          set -e
          cp -rv ../fart12-lite/art/* art/
          cp -rv ../fart12-lite/frameworks/* frameworks/
          cp -rv ../fart12-lite/libcore/* libcore/

          ls frameworks/base/core/java/cn/zskkk/

      - name: Patch boot-jar allowlist
        run: |
          cd aosp
          echo 'cn\.zskkk' >> build/soong/scripts/check_boot_jars/package_allowed_list.txt
          tail -3 build/soong/scripts/check_boot_jars/package_allowed_list.txt

      - name: Setup ccache
        run: |
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=5G" >> $GITHUB_ENV
          ccache -M 5G

      - name: Source build env
        run: |
          cd aosp
          source build/envsetup.sh
          lunch aosp_redfin-userdebug
          echo "lunch complete: TARGET_PRODUCT=${TARGET_PRODUCT} TARGET_BUILD_VARIANT=${TARGET_BUILD_VARIANT}"

      - name: Build system.img (FART-modified ART + framework + libcore)
        run: |
          cd aosp
          source build/envsetup.sh
          lunch aosp_redfin-userdebug
          set -o pipefail
          # fart12-lite modifies ONLY userland: libart.so, framework.jar, services.jar,
          # boot.art, and DexFile.java. These all live under system.img on Android 12+.
          # The kernel (vendor_boot.img + boot.img stub) is unmodified — we ship the
          # factory kernel from the official redfin factory image instead of rebuilding
          # it (Pixel 5 kernel source is NOT public on android.googlesource.com; only
          # prebuilt .ko modules are under device/google/redbull-kernel).
          #
          # Memory budget on the GitHub-hosted ubuntu-22.04 runner is ~15.6GB RAM
          # + 8GB swap. AOSP soong-bootstrap warns "minimum required amount of
          # free memory is around 16GB" at the start of every build, and ART/CC
          # parallel compiles easily OOM-kill the runner (exit 143 = SIGTERM
          # from the runner watchdog, NOT a clang error) within minutes of
          # hitting the first big ninja edge. Mitigation:
          #   -j$(($(nproc) / 2))     → cap concurrency at half the cores
          #                              (2 jobs on the 4-core hosted runner).
          #                              Peak per-job RSS halves → much less
          #                              page-cache pressure on the 15.6GB box.
          #   NINJA_STATUS / -k 0     → let ninja serialize gracefully instead of
          #                              spawning 4 wide-link processes at once.
          #   ANDROID_JAVA_HOME heap  → already set by envsetup, no change.
          #
          # Build takes ~30-60min on a 4-core hosted runner with ccache; with
          # the -j cap expect 60-90min. Acceptable tradeoff vs OOM-rebooting
          # every run.
          m -j$(($(nproc) / 2)) systemimage 2>&1 | tee build.log
          echo "build exit: ${PIPESTATUS[0]}"
          SYS_SIZE=$(stat -c%s out/target/product/redfin/system.img 2>/dev/null || stat -f%z out/target/product/redfin/system.img)
          echo "system.img size: ${SYS_SIZE} bytes"
          # Sanity-check: aosp_redfin system.img should be > 500MB (843MB factory).
          # AOSP-only build is smaller because it omits GMS/Verizon blobs, but still
          # > 200MB. If it's tiny, the build didn't link any modules in.
          if [ "${SYS_SIZE}" -lt 200000000 ]; then
            echo "ERROR: system.img suspiciously small (${SYS_SIZE}B); userland build likely failed" >&2
            exit 1
          fi

      - name: Save ccache + soong bootstrap for next run
        if: always()
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            aosp/out/soong/.bootstrap
          key: build-redfin-${{ github.sha }}

      - name: Upload system image (FART-modified)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: system-image
          path: aosp/out/target/product/redfin/system.img
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: aosp/build.log
          if-no-files-found: warn
          retention-days: 30

  assemble:
    name: "3/3 - assemble flashable bundle (factory + custom boot)"
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Download system image (FART-modified)
        uses: actions/download-artifact@v4
        with:
          name: system-image
          path: images

      - name: Checkout repo (for templates + f1rt.config)
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get install -y unzip

      - name: Download redfin factory image
        run: |
          set -e
          FACTORY_URL="https://dl.google.com/dl/android/aosp/redfin-sq1a.220205.002-factory-734556ab.zip"
          curl -L --fail -o factory.zip "${FACTORY_URL}"
          ls -lh factory.zip
          unzip -q factory.zip -d factory
          ls factory/
          # Inner zip layout: factory/<codename>-<buildid>/image-<codename>-<buildid>-<suffix>.zip
          INNER_ZIP=$(find factory -maxdepth 3 -name 'image-redfin-*.zip' -print -quit)
          echo "INNER_ZIP=${INNER_ZIP}"
          if [ -z "${INNER_ZIP}" ]; then
            echo "ERROR: inner factory zip not found" >&2
            exit 1
          fi
          rm -rf factory/extracted
          mkdir -p factory/extracted
          unzip -q "${INNER_ZIP}" -d factory/extracted
          ls -la factory/extracted/
          # Keep FACTORY system.img/vendor_boot.img/boot.img/dtbo intact.
          # FART only modifies userland under system.img; kernel + bootloader +
          # modem + dtbo come from factory as-is.
          cp factory/extracted/boot.img .
          cp factory/extracted/vendor_boot.img .
          cp factory/extracted/vendor.img .
          cp factory/extracted/dtbo.img .
          cp factory/extracted/bootloader-redfin-*.img .
          cp factory/extracted/radio-redfin-*.img 2>/dev/null || echo "no radio img (OK for redfin)"
          cp factory/extracted/vbmeta.img .
          ls *.img

      - name: Stage bundle
        run: |
          mkdir -p bundle
          # Custom: FART-modified system.img contains libart.so + framework.jar + boot.art
          #         with cn.zskkk.FFaarrtt framework class and DexFile hooks.
          cp images/system.img bundle/system-aosp-fart.img
          # Factory: kernel lives in vendor_boot.img on Android 12+; boot.img is a stub.
          cp boot.img bundle/
          cp vendor_boot.img bundle/
          cp vendor.img bundle/
          cp dtbo.img bundle/
          cp bootloader-redfin-*.img bundle/
          cp radio-redfin-*.img bundle/ 2>/dev/null || true
          cp vbmeta.img bundle/
          cp f1rt.config bundle/

      - name: Generate flash-all.sh
        run: |
          BUILD_TAG="${GITHUB_SHA::7}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sed -e "s|__BUILD_TAG__|${BUILD_TAG}|g" \
              -e "s|__BUILD_DATE__|${BUILD_DATE}|g" \
              flash-all.sh.template > bundle/flash-all.sh
          chmod +x bundle/flash-all.sh
          cat bundle/flash-all.sh | head -10
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_ENV

      - name: Download build log
        uses: actions/download-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Zip bundle
        run: |
          cp build.log bundle/build.log 2>/dev/null || echo "no build log captured"
          cd bundle
          zip -r ../redfin-fart-${GITHUB_SHA::7}.zip .
          cd ..
          ls -lh redfin-fart-*.zip

      - name: Upload final bundle
        uses: actions/upload-artifact@v4
        with:
          name: redfin-fart-bundle
          path: redfin-fart-${GITHUB_SHA::7}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: redfin-fart-${{ github.sha }}
          name: "Redfin FART12 build ${{ github.sha }}"
          body: |
            AOSP 12.1.0_r2 userdebug system.img with fart12-lite patches for Pixel 5 (redfin).

            Bundle contents:
            - system-aosp-fart.img (CUSTOM — AOSP 12.1.0_r2 with FART12 ART/framework/libcore)
            - boot.img, vendor_boot.img (FACTORY — kernel shipped as-is)
            - vendor.img, dtbo.img (FACTORY)
            - bootloader-redfin-*.img, radio-redfin-*.img (FACTORY)
            - vbmeta.img (FACTORY — flash with --disable-verity --disable-verification)
            - flash-all.sh (auto-generated by this build)
            - f1rt.config (FART runtime config — push to /data/local/tmp/)

            Targets com.sacombankpay for DexProtector dump extraction.
            Build SHA: ${{ github.sha }}
            Build date: ${{ env.BUILD_DATE }}
          files: redfin-fart-${{ github.sha }}.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
