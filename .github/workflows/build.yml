name: build-flame-fart

on:
  workflow_dispatch:
    inputs:
      aosp_tag:
        description: "AOSP tag to build"
        required: false
        default: "android-12.0.0_r32"

permissions:
  contents: write

jobs:
  sync:
    name: "1/3 - repo sync AOSP"
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      AOSP_TAG: ${{ inputs.aosp_tag || 'android-12.0.0_r32' }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Create swap (8GB)
        run: |
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install repo tool
        run: |
          sudo apt-get update
          sudo apt-get install -y repo git curl python3
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Checkout repo with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize repo manifest
        working-directory: aosp
        run: |
          repo init -u https://android.googlesource.com/platform/manifest -b ${AOSP_TAG} --depth=1

      - name: Repo sync
        working-directory: aosp
        run: |
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle

      - name: Compress AOSP source
        working-directory: aosp
        run: |
          tar --exclude='.repo/projects' --exclude='.repo/project-objects' \
              --exclude='out' --exclude='ccache' \
              -czf ../aosp-source.tar.gz .
          ls -lh ../aosp-source.tar.gz

      - name: Upload AOSP source artifact
        uses: actions/upload-artifact@v4
        with:
          name: aosp-source
          path: aosp-source.tar.gz
          if-no-files-found: error
          retention-days: 7

  build:
    name: "2/3 - apply patches + m"
    needs: sync
    runs-on: ubuntu-22.04
    timeout-minutes: 480
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Create swap (8GB)
        run: |
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip \
            curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            libncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig ccache \
            python3 python-is-python3

      - name: Download AOSP source artifact
        uses: actions/download-artifact@v4
        with:
          name: aosp-source
          path: aosp-source.tar.gz

      - name: Extract AOSP source
        run: |
          mkdir -p aosp
          tar -xzf aosp-source.tar.gz -C aosp
          ls aosp | head

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.run_id }}
          restore-keys: |
            ccache-

      - name: Checkout repo (submodule access)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply fart12-lite patches
        working-directory: aosp
        run: |
          set -e
          git apply -v ../fart12-lite/art/*.patch 2>/dev/null || true
          git apply -v ../fart12-lite/frameworks/*.patch 2>/dev/null || true
          git apply -v ../fart12-lite/libcore/*.patch 2>/dev/null || true

          # fart12-lite ships full files, not patches — fall back to cp
          cp -rv ../fart12-lite/art/* art/ || true
          cp -rv ../fart12-lite/frameworks/* frameworks/ || true
          cp -rv ../fart12-lite/libcore/* libcore/ || true

      - name: Patch boot-jar allowlist
        working-directory: aosp
        run: |
          echo 'cn\.zskkk' >> build/soong/scripts/check_boot_jars/package_allowed_list.txt
          tail -3 build/soong/scripts/check_boot_jars/package_allowed_list.txt

      - name: Setup ccache
        run: |
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=5G" >> $GITHUB_ENV
          ccache -M 5G

      - name: Source build env
        working-directory: aosp
        run: |
          source build/envsetup.sh
          lunch aosp_flame-userdebug
          echo "TARGET_PRODUCT=$TARGET_PRODUCT" >> $GITHUB_ENV
          echo "TARGET_BUILD_VARIANT=$TARGET_BUILD_VARIANT" >> $GITHUB_ENV

      - name: Build system.img + boot.img + vbmeta.img
        working-directory: aosp
        run: |
          source build/envsetup.sh
          set -o pipefail
          m -j$(nproc) system.img boot.img vbmeta.img 2>&1 | tee build.log | tail -200

      - name: Save ccache for next run
        if: always()
        run: |
          ccache -s
          tar -czf ccache.tar.gz -C ~/.ccache .
          ls -lh ccache.tar.gz

      - name: Upload ccache artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccache-${{ github.run_id }}
          path: ccache.tar.gz
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aosp-images
          path: |
            aosp/out/target/product/flame/boot.img
            aosp/out/target/product/flame/system.img
            aosp/out/target/product/flame/vbmeta.img
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: aosp/build.log
          if-no-files-found: warn
          retention-days: 30

  assemble:
    name: "3/3 - assemble flashable bundle"
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Download AOSP images
        uses: actions/download-artifact@v4
        with:
          name: aosp-images
          path: images

      - name: Checkout repo (for templates + f1rt.config)
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get install -y unzip

      - name: Download flame factory image
        run: |
          set -e
          FACTORY_URL="https://dl.google.com/dl/android/aosp/flame-sp1a.210812.016-factory-8bf4b5d4.zip"
          curl -L --fail -o factory.zip "${FACTORY_URL}"
          ls -lh factory.zip
          unzip -q factory.zip -d factory
          ls factory/
          unzip -q factory/image-flame-sp1a.210812.016.zip -d factory/extracted
          cp factory/extracted/vendor-flame-*.img .
          cp factory/extracted/bootloader-flame-*.img .
          cp factory/extracted/radio-flame-*.img 2>/dev/null || echo "no radio img (OK for flame)"
          ls *.img

      - name: Stage bundle
        run: |
          mkdir -p bundle
          cp images/boot.img bundle/
          cp images/system.img bundle/
          cp images/vbmeta.img bundle/
          cp vendor-flame-*.img bundle/
          cp bootloader-flame-*.img bundle/
          cp radio-flame-*.img bundle/ 2>/dev/null || true
          cp f1rt.config bundle/

      - name: Generate flash-all.sh
        run: |
          BUILD_TAG="${GITHUB_SHA::7}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sed -e "s|__BUILD_TAG__|${BUILD_TAG}|g" \
              -e "s|__BUILD_DATE__|${BUILD_DATE}|g" \
              flash-all.sh.template > bundle/flash-all.sh
          chmod +x bundle/flash-all.sh
          cat bundle/flash-all.sh | head -10

      - name: Download build log
        uses: actions/download-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Zip bundle
        run: |
          cp build.log build.log 2>/dev/null || echo "no build log"
          cd bundle
          zip -r ../flame-fart-${GITHUB_SHA::7}.zip .
          cd ..
          ls -lh flame-fart-*.zip

      - name: Upload final bundle
        uses: actions/upload-artifact@v4
        with:
          name: flame-fart-bundle
          path: flame-fart-${GITHUB_SHA::7}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flame-fart-${{ github.sha }}
          name: "Flame FART12 build ${{ github.sha }}"
          body: |
            AOSP 12.0.0_r32 userdebug image for Pixel 4 (flame) with fart12-lite patches.
            Targets com.sacombankpay for DexProtector dump extraction.
            Build SHA: ${{ github.sha }}
            Build date: ${{ github.run_id }}
          files: flame-fart-${{ github.sha }}.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: true